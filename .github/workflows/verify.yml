name: Verify Flutter and Rust
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo test --manifest-path rust/Cargo.toml --features server --locked
      - run: cargo clippy --manifest-path rust/Cargo.toml --features server --all-targets --locked -- -D warnings
  flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.99.1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - if: runner.os == 'Windows'
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/native_bridge_test.dart --profile -d windows
      - if: runner.os == 'Windows'
        run: flutter build windows --release
      - if: runner.os == 'Linux'
        run: flutter build linux --release
      - if: runner.os == 'macOS'
        run: flutter build macos --release
      - if: runner.os == 'macOS'
        run: flutter build ios --release --no-codesign
      - if: runner.os == 'Linux'
        run: flutter build web --release --no-web-resources-cdn
      - if: runner.os == 'Linux'
        run: cargo build --manifest-path rust/Cargo.toml --release --features server --bin hedone-server --locked
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --target-platform android-arm64
      - run: flutter build apk --release --target-platform android-arm64
