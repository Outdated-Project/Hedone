name: hedone
description: Huangguo Client · Flutter & Rust · For non-commercial use only
publish_to: none
version: 1.0.1+1
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.8.0
  material_3_expressive: 1.2.0
  flutter_rust_bridge: 2.13.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  html: ^0.15.6
  http: ^1.6.0
  flutter_rust_bridge_hooks: 2.13.0
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - assets/brand.png
    - assets/licenses/
    - assets/fonts/notosanssc-OFL.txt
    - assets/fonts/googlesans-OFL.txt
    - assets/fonts/googlesanscode-OFL.txt
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/googlesans.ttf
    - family: Google Sans Code
      fonts:
        - asset: assets/fonts/googlesanscode.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/notosanssc.ttf
