[package]
name = "hghub_core"
version = "2.0.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "PolyForm-Noncommercial-1.0.0"
description = "HGhub native service and validated media transport"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
nextjson = { version = "=0.1.5", features = ["derive"] }
courierust = { version = "=1.1.1" }
rustbinary = { version = "=0.1.10" }
recurse-x = "=0.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy", "gzip", "brotli", "json", "charset", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"
http = "1"
axum = "0.8"
rand = "0.9"
subtle = "2"
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs", "set-header", "limit"] }

[features]
default = []
server = []

[[bin]]
name = "hghub-server"
path = "src/bin/server.rs"
required-features = ["server"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "debuginfo"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
