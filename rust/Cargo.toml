[package]
name = "hghub_core"
version = "2.0.0"
edition = "2024"
publish = false
license = "PolyForm-Noncommercial-1.0.0"
description = "HGhub native service and validated media transport"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "2.13.0"
nextjson = { version = "0.1.5", features = ["derive"] }
courierust = { version = "1.1.2" }
rustbinary = { version = "0.1.10" }
recurse-x = { version = "0.2.5" }
tzcraft = { version = "0.1.2", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "net",
    "sync",
] }
aes = "0.9.4"
base64 = "0.23.1"
percent-encoding = "2"
once_cell = "1"
url = "2"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "query",
    "tokio",
    "matched-path",
    "original-uri",
] }
rand = "0.10.3"
subtle = "2"
futures-util = "0.3"
tower-http = { version = "0.7.1", optional = true, features = ["fs"] }

[features]
default = []
server = ["dep:tower-http"]

[[bin]]
name = "hghub-server"
path = "src/bin/server.rs"
required-features = ["server"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "debuginfo"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
